services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tableserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tableserve}
      POSTGRES_DB: ${POSTGRES_DB:-tableserve}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tableserve}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Backend (Hono / Bun) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./table-serve-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tableserve}:${POSTGRES_PASSWORD:-tableserve}@db:5432/${POSTGRES_DB:-tableserve}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BACKEND_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      TABLE_SESSION_SECRET: ${TABLE_SESSION_SECRET}
      ZEPTOMAIL_API_KEY: ${ZEPTOMAIL_API_KEY:-}
      PORT: 3000
      LOKI_URL: http://loki:3100
      LOKI_ENABLED: "true"
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - internal
      - public

  # ── Grafana Loki (log aggregation) ───────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal

  # ── Grafana (dashboards — free OSS) ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3200}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3200}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - internal
      - public

  # ── Frontend (SvelteKit / Node) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./table-serve-frontend
      dockerfile: Dockerfile
      args:
        # Injected at build time so the Vite proxy target is correct
        VITE_API_BASE: ${BACKEND_URL:-http://backend:3000}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      # Tell the SvelteKit server where the backend lives (for SSR if ever used)
      BACKEND_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    networks:
      - public

volumes:
  postgres_data:
  loki_data:
  grafana_data:

networks:
  internal:
  public:
