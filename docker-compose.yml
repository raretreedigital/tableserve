services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tableserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tableserve}
      POSTGRES_DB: ${POSTGRES_DB:-tableserve}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tableserve}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Backend (Hono / Bun) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./table-serve-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tableserve}:${POSTGRES_PASSWORD:-tableserve}@db:5432/${POSTGRES_DB:-tableserve}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BACKEND_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      TABLE_SESSION_SECRET: ${TABLE_SESSION_SECRET}
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - internal
      - public

  # ── Frontend (SvelteKit / Node) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./table-serve-frontend
      dockerfile: Dockerfile
      args:
        # Injected at build time so the Vite proxy target is correct
        VITE_API_BASE: ${BACKEND_URL:-http://backend:3000}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      # Tell the SvelteKit server where the backend lives (for SSR if ever used)
      BACKEND_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    networks:
      - public

volumes:
  postgres_data:

networks:
  internal:
  public:
