name: table_serve_app
description: Table Serve — Waiter mobile app for order management.
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3+1

  # Local storage
  shared_preferences: ^2.2.3

  # Local notifications (new order alerts)
  flutter_local_notifications: ^17.2.1+2

  # UI extras
  cached_network_image: ^3.3.1
  timeago: ^3.7.0
  intl: ^0.19.0
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
