<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Table Serve - NFC-based restaurant ordering" />
		<script>
			// Apply theme before page render to avoid flash
			;(function () {
				const stored = localStorage.getItem('theme')
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
				if (stored === 'dark' || (!stored && prefersDark)) {
					document.documentElement.classList.add('dark')
				}
			})()
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-white dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen transition-colors duration-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
